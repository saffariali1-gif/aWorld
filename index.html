lightbox.addEventListener('pointerup', e=>{
  if(lbSwipeX===null) return;
  const dx = e.clientX - lbSwipeX;
  if(Math.abs(dx) > 40){
    goToSlide(galleryIndex + (dx<0 ? 1 : -1), true);
    updateLightboxIfOpen();
  }
  lbSwipeX = null;
});

function openPanel(d, x, y){
  panel.style.clipPath = `circle(0% at ${x}px ${y}px)`;
  panel.style.webkitClipPath = `circle(0% at ${x}px ${y}px)`;
  panelBody.classList.remove('show');

  panelTags.innerHTML = '';
  d.tags.forEach(t=>{ const s=document.createElement('span'); s.textContent=t; panelTags.appendChild(s); });

  if(d.images && d.images.length){
    galleryImages = d.images;
    goToSlide(0, true);
    renderGalleryDots();
    panelGallery.classList.add('show');
    preloadRestLazily();
  } else {
    panelGallery.classList.remove('show');
    galleryImages = [];
  }

  panelBody.textContent = d.body || '';

  panelFields.innerHTML = '';
  if(d.fields && d.fields.length){
    d.fields.forEach(f=>{
      const row = document.createElement('div'); row.className = 'fieldRow';
      const l = document.createElement('span'); l.className = 'fieldLabel'; l.textContent = f.label;
      const v = document.createElement('span'); v.className = 'fieldValue'; v.textContent = f.value;
      row.appendChild(l); row.appendChild(v);
      panelFields.appendChild(row);
    });
    panelFields.classList.add('show');
  } else {
    panelFields.classList.remove('show');
  }

  requestAnimationFrame(()=>{
    panel.classList.add('open');
    panel.style.clipPath = `circle(150% at ${x}px ${y}px)`;
    panel.style.webkitClipPath = `circle(150% at ${x}px ${y}px)`;
  });

  scrambleInto(panelTitle, d.title, 550);
  setTimeout(()=> scrambleInto(panelTagline, d.tagline, 500), 220);
  setTimeout(()=> panelBody.classList.add('show'), 500);
}

function closePanel(x, y){
  panel.style.clipPath = `circle(0% at ${x}px ${y}px)`;
  panel.style.webkitClipPath = `circle(0% at ${x}px ${y}px)`;
  setTimeout(()=> panel.classList.remove('open'), 950);
  closeLightbox();
}

panelClose.addEventListener('click', ()=>{
  const r = panelClose.getBoundingClientRect();
  closePanel(r.left, r.top);
});

/* =========================================================================
   NIGHT — the world is locked permanently to its night-time look (the
   sky/day toggle and its lerp machinery have been removed).
   ========================================================================= */
let rainGroupOpacityMul = 1;

const clock = new THREE.Clock();
const dummy = new THREE.Object3D();
const cxEl = document.getElementById('cx'), czEl = document.getElementById('cz');

function easeOutBack(t){ const c=1.6; return 1+c*Math.pow(t-1,3)+c*Math.pow(t-1,2); }

function updateAssembly(elapsed){
  let stillGrowing = false;
  for(const b of buildingData){
    const t = (elapsed - b.delay);
    if(t <= 0){ stillGrowing = true; continue; }
    const p = Math.min(t/0.4, 1);
    if(p < 1) stillGrowing = true;
    const scaleY = Math.max(0.001, easeOutBack(p) * b.h);
    dummy.position.set(b.x, 0, b.z);
    dummy.scale.set(b.w, scaleY, b.d);
    dummy.updateMatrix();
    b.mesh.setMatrixAt(b.idx, dummy.matrix);
    b.edge.scale.set(b.w, scaleY, b.d);
    if(b.roof){
      if(p > 0.85){
        b.roof.visible = true;
        b.roof.position.y = scaleY + (b.roof.geometry.parameters.height||0.4)/2;
      } else {
        b.roof.visible = false;
      }
    }
  }
  buildingMeshes.forEach(m=> m.instanceMatrix.needsUpdate = true);

  for(const sb of specialBuildings){
    const t = (elapsed - sb.delay);
    if(t <= 0){ stillGrowing = true; continue; }
    const p = Math.min(t/0.4, 1);
    if(p < 1) stillGrowing = true;
    const s = Math.max(0.001, easeOutBack(p));
    sb.group.scale.set(s,s,s);
  }

  return stillGrowing;
}

let assembling = false;
let edgesMerged = false;
const mergedEdgeMeshes = []; // filled in once, replaces per-building edge draw calls

function mergeBuildingEdges(){
  const localPos = edgeGeo.attributes.position.array; // unit-box edge vertices, pivot at base
  const vertCount = localPos.length / 3;

  const byVariant = edgeTints.map(()=> []);
  for(const b of buildingData) byVariant[b.variant].push(b);

  edgeTints.forEach((tint, variant)=>{
    const group = byVariant[variant];
    if(!group.length) return;
    const positions = new Float32Array(group.length * vertCount * 3);
    let o = 0;
    for(const b of group){
      for(let i=0;i<vertCount;i++){
        positions[o++] = localPos[i*3]   * b.w + b.x;
        positions[o++] = localPos[i*3+1] * b.h;
        positions[o++] = localPos[i*3+2] * b.d + b.z;
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.LineBasicMaterial({ color: tint, transparent:true, opacity:0.55 });
    const merged = new THREE.LineSegments(geo, mat);
    scene.add(merged);
    mergedEdgeMeshes.push(merged);
  });

  // the per-building edges are now redundant — remove them from the scene
  // (this is what was costing ~250 extra draw calls)
  for(const b of buildingData){ scene.remove(b.edge); b.edge.geometry.dispose?.(); b.edge = null; }
  edgesMerged = true;
}

let facesMerged = false;
const mergedFaceMeshes = [];

function mergeBuildingFaces(){
  // start from a single correctly-wound unit box (pivot at base) and expand
  // it to individual triangles so per-vertex face/UV data is easy to reuse
  const unitBox = new THREE.BoxGeometry(1,1,1).translate(0,0.5,0).toNonIndexed();
  const uPos = unitBox.attributes.position.array;
  const uNorm = unitBox.attributes.normal.array;
  const uUv = unitBox.attributes.uv.array;
  const vertCount = uPos.length / 3;
  const triCount = vertCount / 3;

  // classify each triangle as "cap" (top/bottom, normal.y dominant) or
  // "wall" (side, gets the window facade), then collapse into contiguous
  // vertex ranges so each building only needs a couple of geometry groups
  // rather than one per triangle — this is what keeps rooftops looking like
  // flat roofs instead of more windows facing straight up at the sky.
  const faceRanges = [];
  {
    let start = 0, cur = Math.abs(uNorm[1]) > 0.5;
    for(let ti=1; ti<=triCount; ti++){
      const isCap = ti < triCount ? Math.abs(uNorm[ti*9+1]) > 0.5 : !cur;
      if(ti === triCount || isCap !== cur){
        faceRanges.push({ startVert: start*3, count: (ti-start)*3, isCap: cur });
        start = ti;
        cur = isCap;
      }
    }
  }

  const byVariant = buildingTexVariants.map(()=> []);
  for(const b of buildingData) byVariant[b.variant].push(b);

  buildingTexVariants.forEach((tex, variant)=>{
    const group = byVariant[variant];
    if(!group.length) return;
    const positions = new Float32Array(group.length * vertCount * 3);
    const normals   = new Float32Array(group.length * vertCount * 3);
    const uvs       = new Float32Array(group.length * vertCount * 2);
    let po=0, no=0, uo=0;
    for(const b of group){
      for(let i=0;i<vertCount;i++){
        const nx = uNorm[i*3], ny = uNorm[i*3+1], nz = uNorm[i*3+2];
        positions[po++] = uPos[i*3]   * b.w + b.x;
        positions[po++] = uPos[i*3+1] * b.h;
        positions[po++] = uPos[i*3+2] * b.d + b.z;
        normals[no++] = nx; normals[no++] = ny; normals[no++] = nz;

        const baseU = uUv[i*2], baseV = uUv[i*2+1];
        let uRep, vRep;
        if(Math.abs(nx) > 0.5){        // +/-X faces: span depth × height
          uRep = b.d / TEX_UNIT_U; vRep = b.h / TEX_UNIT_V;
        } else if(Math.abs(nz) > 0.5){ // +/-Z faces: span width × height
          uRep = b.w / TEX_UNIT_U; vRep = b.h / TEX_UNIT_V;
        } else {                       // top/bottom: span width × depth
          uRep = b.w / TEX_UNIT_U; vRep = b.d / TEX_UNIT_U;
        }
        uvs[uo++] = baseU * uRep;
        uvs[uo++] = baseV * vRep;
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

    // one pair of groups per building (wall range + cap range), pointing at
    // material index 0 (window facade) or 1 (flat roof)
    for(let bi=0; bi<group.length; bi++){
      const base = bi * vertCount;
      for(const r of faceRanges){
        geo.addGroup(base + r.startVert, r.count, r.isCap ? 1 : 0);
      }
    }

    const windowMat = new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff });
    const merged = new THREE.Mesh(geo, [windowMat, capMat]);
    scene.add(merged);
    mergedFaceMeshes.push(merged);
  });

  // the instanced boxes are now fully replaced — hide them rather than
  // dispose, since their materials/textures are shared with the merged mesh
  for(const m of buildingMeshes){ m.visible = false; }
  facesMerged = true;
}

/* =========================================================================
   SKY TRAFFIC — a small airliner and a lone craft occasionally cross high
   above the skyline. Each has its own random cooldown so sightings stay
   rare and unscripted rather than looping on a fixed timer.
   ========================================================================= */
function createAirplane(tint){
  const group = new THREE.Group();
  const hullMat = new THREE.MeshBasicMaterial({ color: 0x12181c });
  const trimMat = new THREE.LineBasicMaterial({ color: tint, transparent:true, opacity:0.6 });

  const fuseGeo = new THREE.BoxGeometry(0.3, 0.3, 2.6);
  const fuselage = new THREE.Mesh(fuseGeo, hullMat);
  group.add(fuselage);
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(fuseGeo), trimMat));

  const noseGeo = new THREE.ConeGeometry(0.15, 0.55, 6);
  const nose = new THREE.Mesh(noseGeo, hullMat);
  nose.rotation.x = -Math.PI/2;
  nose.position.z = -1.58;
  group.add(nose);
  const noseEdge = new THREE.LineSegments(new THREE.EdgesGeometry(noseGeo), trimMat);
  noseEdge.rotation.x = -Math.PI/2; noseEdge.position.copy(nose.position);
  group.add(noseEdge);

  const wingGeo = new THREE.BoxGeometry(2.6, 0.06, 0.55);
  const wing = new THREE.Mesh(wingGeo, hullMat);
  wing.position.set(0, -0.02, 0.15);
  group.add(wing);
  const wingEdge = new THREE.LineSegments(new THREE.EdgesGeometry(wingGeo), trimMat);
  wingEdge.position.copy(wing.position);
  group.add(wingEdge);

  const tailWingGeo = new THREE.BoxGeometry(0.95, 0.05, 0.34);
  const tailWing = new THREE.Mesh(tailWingGeo, hullMat);
  tailWing.position.set(0, 0.06, 1.1);
  group.add(tailWing);
  const tailWingEdge = new THREE.LineSegments(new THREE.EdgesGeometry(tailWingGeo), trimMat);
  tailWingEdge.position.copy(tailWing.position);
  group.add(tailWingEdge);

  const finGeo = new THREE.BoxGeometry(0.05, 0.44, 0.36);
  const fin = new THREE.Mesh(finGeo, hullMat);
  fin.position.set(0, 0.3, 1.15);
  group.add(fin);
  const finEdge = new THREE.LineSegments(new THREE.EdgesGeometry(finGeo), trimMat);
  finEdge.position.copy(fin.position);
  group.add(finEdge);

  const tipGeo = new THREE.BoxGeometry(0.07,0.07,0.07);
  const lightL = new THREE.Mesh(tipGeo, new THREE.MeshBasicMaterial({ color: tint }));
  lightL.position.set(1.28, -0.02, 0.15);
  group.add(lightL);
  const lightR = new THREE.Mesh(tipGeo, new THREE.MeshBasicMaterial({ color: tint }));
  lightR.position.set(-1.28, -0.02, 0.15);
  group.add(lightR);

  const beacon = new THREE.Mesh(tipGeo, new THREE.MeshBasicMaterial({ color: 0xeaf5f2, transparent:true, opacity:1 }));
  beacon.position.set(0, 0.18, -0.4);
  group.add(beacon);
  group.userData.beacon = beacon;

  group.scale.setScalar(1.6);
  return group;
}

function createSpaceship(tint){
  const group = new THREE.Group();
  const hullMat = new THREE.MeshBasicMaterial({ color: 0x0b1013 });
  const trimMat = new THREE.LineBasicMaterial({ color: tint, transparent:true, opacity:0.7 });

  const hullGeo = new THREE.CylinderGeometry(1.05, 1.35, 0.34, 10);
  const hull = new THREE.Mesh(hullGeo, hullMat);
  group.add(hull);
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(hullGeo), trimMat));

  const domeGeo = new THREE.CylinderGeometry(0.42, 0.72, 0.42, 8);
  const dome = new THREE.Mesh(domeGeo, hullMat);
  dome.position.y = 0.36;
  group.add(dome);
  const domeEdge = new THREE.LineSegments(new THREE.EdgesGeometry(domeGeo), trimMat);
  domeEdge.position.copy(dome.position);
  group.add(domeEdge);

  const ringGeo = new THREE.RingGeometry(0.5, 0.64, 24);
  const ringMat = new THREE.MeshBasicMaterial({ color: tint, transparent:true, opacity:0.55, side:THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI/2;
  ring.position.y = -0.19;
  group.add(ring);
  group.userData.ring = ring;

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent:true, opacity:0.5, depthWrite:false }));
  glow.scale.setScalar(2.6);
  glow.position.y = -0.2;
  group.add(glow);
  group.userData.glow = glow;

  group.scale.setScalar(1.5);
  return group;
}

const skyCraft = [
  { mesh: createAirplane(edgeTints[3]), kind:'plane', altitude:30, speed:8.5,  minWait:16, maxWait:40 },
  { mesh: createSpaceship(edgeTints[0]), kind:'ship',  altitude:38, speed:4.2,  minWait:55, maxWait:120 }
];

for(const craft of skyCraft){
  craft.mesh.visible = false;
  scene.add(craft.mesh);
  craft.flying = false;
  craft.elapsed = 0;
  craft.duration = 1;
  craft.start = new THREE.Vector3();
  craft.end = new THREE.Vector3();
  craft.timer = craft.minWait + Math.random()*(craft.maxWait - craft.minWait);
}

function launchCraft(craft){
  const angle = Math.random()*Math.PI*2;
  const dir = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle));
  const span = 55 + Math.random()*15;
  const cx = rig.position.x + (Math.random()-0.5)*14;
  const cz = rig.position.z + (Math.random()-0.5)*14;
  craft.start.set(cx - dir.x*span, craft.altitude, cz - dir.z*span);
  craft.end.set(cx + dir.x*span, craft.altitude, cz + dir.z*span);
  craft.mesh.position.copy(craft.start);
  craft.mesh.lookAt(craft.end);
  craft.mesh.rotateY(Math.PI);
  craft.mesh.visible = true;
  craft.flying = true;
  craft.elapsed = 0;
  craft.duration = craft.start.distanceTo(craft.end) / craft.speed;
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if(bootDone){
    if(!assembling){ assembling = true; }
    const elapsed = (performance.now() - assembleStart)/1000;
    if(elapsed < 0.9) updateAssembly(elapsed);
    else if(!edgesMerged) mergeBuildingEdges();
    else if(!facesMerged) mergeBuildingFaces();

    if(povActive){
      // gather input as a single -1..1 vector so keys and the analog
      // joystick both drive speed proportionally (partial stick push = a
      // slower walk, full push = a run) instead of snapping to one speed
      let inX = 0, inY = 0;
      if(keys.has('w')||keys.has('arrowup'))    inY += 1;
      if(keys.has('s')||keys.has('arrowdown'))  inY -= 1;
      if(keys.has('a')||keys.has('arrowleft'))  inX -= 1;
      if(keys.has('d')||keys.has('arrowright')) inX += 1;
      if(joystickActive){
        if(Math.abs(joystickX) > 0.12) inX += joystickX;
        if(Math.abs(joystickY) > 0.12) inY += -joystickY;
      }
      const rawMag = Math.hypot(inX, inY);
      if(rawMag > 1){ inX /= rawMag; inY /= rawMag; }
      const mag = Math.min(1, rawMag);
      const running = keys.has('shift') || rawMag > 0.94;
      const maxSpeed = running ? 4.6 : 2.6;
      const targetSpeed = mag * maxSpeed;

      const accelEase = 1 - Math.pow(0.0012, dt || 0.016);
      povSpeedCurrent += (targetSpeed - povSpeedCurrent) * accelEase;

      if(mag > 0.001 && povSpeedCurrent > 0.02){
        const dx = inX/mag, dy = inY/mag;
        rig.position.addScaledVector(povForward, dy*povSpeedCurrent*dt);
        rig.position.addScaledVector(povRight, dx*povSpeedCurrent*dt);
        povWalkPhase += dt * (BOB_FREQ * (0.55 + 0.45*(povSpeedCurrent/maxSpeed)));
      }
      clampRig();
      resolvePovCollisions();
    } else {
      // keyboard movement (isometric pan mode)
      const speed = 9 * dt;
      if(keys.has('w')||keys.has('arrowup'))    rig.position.addScaledVector(FORWARD, speed);
      if(keys.has('s')||keys.has('arrowdown'))  rig.position.addScaledVector(FORWARD, -speed);
      if(keys.has('a')||keys.has('arrowleft'))  rig.position.addScaledVector(RIGHT, -speed);
      if(keys.has('d')||keys.has('arrowright')) rig.position.addScaledVector(RIGHT, speed);
      clampRig();
    }
  }

  if(povActive) updatePovCamera(dt); else updateCamera(dt);

  // crosshair lights up when a sign is directly ahead, in reach, in POV mode
  if(povActive){
    raycaster.setFromCamera(CENTER_NDC, povCamera);
    const hits = raycaster.intersectObjects(placeholderMeshes);
    crosshairEl.classList.toggle('targeting', hits.length > 0 && hits[0].distance < 9);
  }

  // rain / floating particles
  for(const s of rainSprites){
    s.material.opacity = s.userData.baseOpacity * rainGroupOpacityMul;
    if(s.userData.rising){
      s.position.y += s.userData.speed*0.25*dt;
      if(s.position.y > 22) s.position.y = 0;
    } else {
      s.position.y -= s.userData.speed*dt;
      if(s.position.y < 0) s.position.y = 20 + Math.random()*4;
    }
  }

  // traffic light indicators — tint each intersection marker by whichever
  // direction currently has right of way
  for(const e of trafficLightCoords){
    const green = trafficHorizontalGreen(e.x, e.z, t);
    const col = green ? TL_GREEN_H : TL_GREEN_V;
    trafficLights.instanceColor.setXYZ(e.idx, col.r, col.g, col.b);
  }
  trafficLights.instanceColor.needsUpdate = true;

  // cars drive continuously along their street and wrap at the city edge,
  // easing to a stop at red lights and never getting stuck mid-intersection
  const edge = CITY_HALF + 3;
  for(const v of vehicles){
    const u = v.userData;
    const mul = intersectionSpeedMul(u.pos, u.dir, u.lane, u.horizontal, ROAD_HALF+0.15, ROAD_HALF+2.4, t);
    u.pos += u.dir * u.speed * mul * dt;
    if(u.pos > edge) u.pos = -edge;
    if(u.pos < -edge) u.pos = edge;
    if(u.horizontal) v.position.set(u.pos, 0, u.lane);
    else v.position.set(u.lane, 0, u.pos);
  }

  // people standing on the sidewalks — a small idle weight-shift
  for(const p of standingPeople){
    const rig = p.userData.rig;
    const sway = Math.sin(t*0.7 + p.userData.phase) * 0.06;
    rig.armL.rotation.x = sway*0.4;
    rig.armR.rotation.x = -sway*0.4;
    p.position.y = Math.abs(Math.sin(t*0.7 + p.userData.phase))*0.004;
  }

  // people walking continuously along the sidewalk, with a proper gait
  for(const p of walkingPeople){
    const u = p.userData;
    const mul = intersectionSpeedMul(u.pos, u.dir, u.lane, u.horizontal, ROAD_HALF+0.3, ROAD_HALF+1.5, t);
    u.pos += u.dir * u.speed * mul * dt;
    if(u.pos > edge) u.pos = -edge;
    if(u.pos < -edge) u.pos = edge;
    if(u.horizontal) p.position.set(u.pos, 0, u.lane);
    else p.position.set(u.lane, 0, u.pos);

    u.gaitTime = (u.gaitTime||0) + dt*7*mul; // gait pauses along with the pedestrian, not just visually slides
    const stride = Math.sin(u.gaitTime + u.phase);
    const rig = p.userData.rig;
    rig.legL.rotation.x = stride*0.55;
    rig.legR.rotation.x = -stride*0.55;
    rig.armL.rotation.x = -stride*0.4;
    rig.armR.rotation.x = stride*0.4;
    p.position.y = Math.abs(stride)*0.012*Math.max(0.15,mul);
  }

  // sitting cats — idle tail sway, occasional ear twitch, no locomotion
  for(const c of sittingCats){
    const rig = c.userData.rig;
    rig.tail.rotation.y = Math.sin(t*1.1 + c.userData.phase) * 0.35;
  }

  // roaming cats — wander freely between random sidewalk points (unlike
  // cars/pedestrians they aren't locked to one axis), pausing occasionally
  for(const c of roamingCats){
    const u = c.userData;
    const rig = c.userData.rig;
    if(u.pauseTimer > 0){
      u.pauseTimer -= dt;
      rig.tail.rotation.y = Math.sin(t*1.4 + (u.gaitPhase||0)) * 0.3;
    } else {
      const dx = u.target.x - c.position.x, dz = u.target.z - c.position.z;
      const dist = Math.hypot(dx, dz);
      if(dist < 0.25){
        u.target = randomCatPoint();
        u.pauseTimer = 0.6 + Math.random()*3;
      } else {
        const nx = dx/dist, nz = dz/dist;
        c.position.x += nx * u.speed * dt;
        c.position.z += nz * u.speed * dt;
        resolveCatCollisions(c);
        c.rotation.y = Math.atan2(nx, nz);
        u.gaitPhase += dt * 9;
        const stride = Math.sin(u.gaitPhase);
        rig.legs[0].rotation.x = stride*0.5;   // front-left
        rig.legs[1].rotation.x = -stride*0.5;  // front-right
        rig.legs[2].rotation.x = -stride*0.5;  // back-left
        rig.legs[3].rotation.x = stride*0.5;   // back-right
        c.position.y = Math.abs(stride)*0.006;
        rig.tail.rotation.y = Math.sin(t*2.4 + u.gaitPhase*0.3) * 0.2;
      }
    }
  }

  // sky traffic — plane & ship crossing overhead on independent cooldowns
  for(const craft of skyCraft){
    if(craft.flying){
      craft.elapsed += dt;
      const p = Math.min(craft.elapsed / craft.duration, 1);
      craft.mesh.position.lerpVectors(craft.start, craft.end, p);

      if(craft.kind === 'plane'){
        craft.mesh.userData.beacon.material.opacity = 0.2 + 0.8*Math.max(0, Math.sin(t*6));
      } else {
        craft.mesh.position.y += Math.sin(craft.elapsed*1.8)*0.3;
        const ring = craft.mesh.userData.ring;
        ring.rotation.z += dt*1.4;
        const pulse = 0.85 + Math.sin(t*2.2)*0.15;
        ring.scale.set(pulse,pulse,1);
        craft.mesh.userData.glow.material.opacity = 0.35 + Math.sin(t*2.2)*0.15;
      }

      if(p >= 1){
        craft.flying = false;
        craft.mesh.visible = false;
        craft.timer = craft.minWait + Math.random()*(craft.maxWait - craft.minWait);
      }
    } else {
      craft.timer -= dt;
      if(craft.timer <= 0) launchCraft(craft);
    }
  }

  // beacon + sign pulse
  for(const s of placeholderGroup.children){
    if(s.userData && s.userData.phase !== undefined && s.userData.baseY !== undefined){
      s.position.y = s.userData.baseY + Math.sin(t*1.3 + s.userData.phase)*0.15;
    }
    if(s.userData && s.userData.phase !== undefined && s.geometry && s.geometry.type==='RingGeometry'){
      const sc = 1 + Math.sin(t*1.6 + s.userData.phase)*0.12;
      s.scale.set(sc,sc,1);
    }
  }

  // HUD coordinates
  cxEl.textContent = rig.position.x.toFixed(1).padStart(6,'0');
  czEl.textContent = rig.position.z.toFixed(1).padStart(6,'0');

  renderer.render(scene, camera);
}
animate();

/* =========================================================================
   RESIZE
   ========================================================================= */
window.addEventListener('resize', ()=>{
  aspect = window.innerWidth/window.innerHeight;
  isoCamera.left = -FRUSTUM*aspect/2; isoCamera.right = FRUSTUM*aspect/2;
  isoCamera.top = FRUSTUM/2; isoCamera.bottom = -FRUSTUM/2;
  isoCamera.updateProjectionMatrix();
  povCamera.aspect = aspect;
  povCamera.updateProjectionMatrix();
  applyRendererSize();
});

})();
</script>
</body>
</html>
