<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>A_WORLD // Another World</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

  :root{
    --bg:#030507;
    --near-black:#0a0d10;
    --gray:#1a2226;
    --white:#eaf5f2;
    --cyan:#6fe3d4;
    --green:#5bc98a;
    --blue:#5a7fa3;
    --dim:rgba(234,245,242,0.45);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--white);
    font-family:'JetBrains Mono', ui-monospace, 'Courier New', monospace;
    overflow:hidden; overscroll-behavior:none;
  }

  canvas{ display:block; touch-action:none; }

  #world{ position:fixed; inset:0; cursor:grab; }
  #world.dragging{ cursor:grabbing; }
  #world.hoverable{ cursor:pointer; }

  /* ---------- boot sequence ---------- */
  #boot{
    position:fixed; inset:0; background:var(--bg);
    z-index:50; display:flex; align-items:flex-end;
    padding:6vh 6vw; transition:opacity .4s ease;
  }
  #boot pre{
    margin:0; font-size:12px; line-height:1.8; letter-spacing:0.02em;
    color:var(--green); white-space:pre-wrap; text-shadow:0 0 8px rgba(91,201,138,0.35);
  }
  #boot .cursor{ display:inline-block; width:7px; height:12px; background:var(--green); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- ambient hud ---------- */
  #hud{
    position:fixed; inset:0; pointer-events:none; z-index:20;
    opacity:0; transition:opacity 1.6s ease;
  }
  #hud.visible{ opacity:1; }
  #mark{
    position:absolute; top:20px; left:22px; font-size:11px; letter-spacing:0.18em;
    color:var(--dim);
  }
  #mark b{ color:var(--cyan); font-weight:500; }
  #coords{
    position:absolute; top:20px; right:22px; font-size:11px; letter-spacing:0.08em;
    color:var(--dim); text-align:right;
  }
  #hint{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:0.14em; color:var(--dim); text-align:center;
    transition:opacity 1.4s ease; white-space:nowrap;
  }

  #rotateLeftBtn, #rotateRightBtn{
    position:fixed; bottom:20px; z-index:25; pointer-events:auto;
    background:transparent; border:1px solid rgba(111,227,212,0.25);
    color:var(--dim); font-family:inherit; font-size:15px; line-height:1;
    padding:8px 13px; cursor:pointer;
    transition:border-color .3s ease, color .3s ease;
  }
  #rotateLeftBtn:hover, #rotateRightBtn:hover{ border-color:var(--cyan); color:var(--cyan); }
  #rotateLeftBtn{ left:22px; }
  #rotateRightBtn{ right:22px; }

  /* ---------- POV / walk toggle ---------- */
  #povToggleBtn{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:26; pointer-events:auto;
    background:rgba(3,5,7,0.55); border:1px solid rgba(111,227,212,0.35);
    color:var(--dim); font-family:inherit; font-size:11px; letter-spacing:0.14em;
    padding:10px 18px; cursor:pointer; white-space:nowrap;
    transition:border-color .3s ease, color .3s ease, background .3s ease;
  }
  #povToggleBtn:hover{ border-color:var(--cyan); color:var(--cyan); }
  #povToggleBtn.active{ color:var(--bg); background:var(--cyan); border-color:var(--cyan); }

  body.pov-active #rotateLeftBtn,
  body.pov-active #rotateRightBtn{ display:none; }

  /* ---------- screenshot button, shown only in POV mode ---------- */
  #screenshotBtn{
    position:fixed; top:18px; right:18px; z-index:26; pointer-events:none;
    width:42px; height:42px; border-radius:50%;
    background:rgba(3,5,7,0.55); border:1px solid rgba(111,227,212,0.35);
    color:var(--dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0; transform:scale(0.85);
    transition:opacity .3s ease, transform .3s ease, border-color .2s ease, color .2s ease;
  }
  body.pov-active #screenshotBtn{ opacity:1; transform:scale(1); pointer-events:auto; }
  #screenshotBtn:hover{ border-color:var(--cyan); color:var(--cyan); }
  #screenshotBtn:active{ transform:scale(0.9); }

  #captureFlash{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    background:#eaf5f2; opacity:0; transition:opacity 60ms ease-out;
  }
  #captureFlash.flash{ opacity:0.85; transition:none; }

  #captureToast{
    position:fixed; top:68px; right:18px; z-index:26; pointer-events:none;
    background:rgba(3,5,7,0.7); border:1px solid rgba(111,227,212,0.35);
    color:var(--cyan); font-family:inherit; font-size:10px; letter-spacing:0.12em;
    padding:6px 10px; opacity:0; transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
  }
  #captureToast.show{ opacity:1; transform:translateY(0); }

  /* ---------- crosshair, shown only in POV mode ---------- */
  #crosshair{
    position:fixed; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; border:1px solid rgba(234,245,242,0.55);
    z-index:22; pointer-events:none; opacity:0; transition:opacity .3s ease, background .15s ease, transform .15s ease;
  }
  body.pov-active #crosshair{ opacity:0.85; }
  #crosshair.targeting{ background:var(--cyan); border-color:var(--cyan); transform:scale(1.8); }

  /* ---------- movement thumbstick (touch + mouse) ---------- */
  #joystick{
    position:fixed; left:26px; bottom:90px; width:104px; height:104px; z-index:26;
    display:none; pointer-events:auto; touch-action:none;
  }
  body.pov-active #joystick{ display:block; }
  #joystickBase{
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(111,227,212,0.3); background:rgba(3,5,7,0.35);
  }
  #joystickThumb{
    position:absolute; top:50%; left:50%; width:44px; height:44px; margin:-22px 0 0 -22px;
    border-radius:50%; background:rgba(111,227,212,0.28); border:1px solid rgba(111,227,212,0.6);
    transition:transform .05s linear;
  }

  /* ---------- gallery panel : grows from the point that was clicked ---------- */
  #panelLayer{ position:fixed; inset:0; z-index:40; pointer-events:none; }
  #panel{
    position:absolute; top:0; left:0; width:100%; height:100%;
    clip-path:circle(0% at 50% 50%);
    -webkit-clip-path:circle(0% at 50% 50%);
    transition:clip-path .95s cubic-bezier(.65,0,.24,1), -webkit-clip-path .95s cubic-bezier(.65,0,.24,1);
    background:
      linear-gradient(180deg, rgba(3,5,7,0.94), rgba(3,5,7,0.985) 40%),
      var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  #panel.open{ pointer-events:auto; }
  #panelInner{
    width:min(560px, 86vw); max-height:78vh; overflow-y:auto;
    border:1px solid rgba(111,227,212,0.22);
    padding:34px 32px 30px;
    background:linear-gradient(180deg, rgba(10,13,16,0.5), rgba(10,13,16,0.2));
    box-shadow:0 0 60px rgba(111,227,212,0.05), inset 0 0 40px rgba(111,227,212,0.03);
    opacity:0; transform:translateY(10px);
    transition:opacity .5s ease .25s, transform .5s ease .25s;
  }
  #panel.open #panelInner{ opacity:1; transform:translateY(0); }
  #panelEyebrow{ font-size:10px; letter-spacing:0.24em; color:var(--cyan); margin-bottom:14px; }
  #panelTitle{ font-size:26px; font-weight:500; letter-spacing:0.01em; margin:0 0 10px; color:var(--white); min-height:1.3em; }
  #panelTagline{ font-size:13px; color:var(--green); margin:0 0 22px; letter-spacing:0.02em; min-height:1.2em; }
  #panelBody{ font-size:13px; line-height:1.85; color:var(--dim); margin:0 0 24px; opacity:0; transition:opacity .6s ease; }
  #panelBody.show{ opacity:1; }
  #panelBody:empty{ display:none; }

  /* ---------- flip-through gallery ---------- */
  #panelGallery{ display:none; margin:0 0 22px; }
  #panelGallery.show{ display:block; }
  #galleryFrame{
    position:relative; width:100%; aspect-ratio:16/10; overflow:hidden;
    border:1px solid rgba(111,227,212,0.22); background:#050709;
    cursor:zoom-in;
  }
  #galleryImg{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    will-change:transform, opacity; z-index:1;
  }
  #galleryExpand{
    position:absolute; top:8px; right:8px; z-index:3;
    background:rgba(3,5,7,0.55); border:1px solid rgba(111,227,212,0.3);
    color:var(--cyan); width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .2s ease, border-color .2s ease;
  }
  #galleryExpand:hover{ background:rgba(111,227,212,0.15); border-color:var(--cyan); }
  .galleryNav{
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(3,5,7,0.55); border:1px solid rgba(111,227,212,0.3);
    color:var(--cyan); width:30px; height:30px; font-family:inherit; font-size:14px;
    cursor:pointer; line-height:1; z-index:3;
  }
  .galleryNav:hover{ background:rgba(111,227,212,0.15); }
  #galleryPrev{ left:8px; } #galleryNext{ right:8px; }
  #galleryDots{ display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  #galleryDots span{
    width:6px; height:6px; border-radius:50%; background:rgba(234,245,242,0.2);
    cursor:pointer; transition:background .25s ease;
  }
  #galleryDots span.active{ background:var(--cyan); }

  /* ---------- fullscreen lightbox ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:80; background:rgba(3,5,7,0.97);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  #lightbox.open{ opacity:1; pointer-events:auto; }
  #lightboxImg{
    max-width:92vw; max-height:88vh; object-fit:contain;
    box-shadow:0 0 60px rgba(0,0,0,0.6);
    opacity:0; transform:scale(0.97); transition:opacity .25s ease, transform .25s ease;
  }
  #lightbox.open #lightboxImg{ opacity:1; transform:scale(1); }
  #lightboxClose{
    position:absolute; top:18px; right:18px; z-index:2;
    background:rgba(3,5,7,0.55); border:1px solid rgba(111,227,212,0.3);
    color:var(--dim); width:38px; height:38px; font-family:inherit; font-size:18px;
    cursor:pointer; transition:border-color .2s ease, color .2s ease;
  }
  #lightboxClose:hover{ border-color:var(--cyan); color:var(--cyan); }
  .lightboxNav{
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(3,5,7,0.55); border:1px solid rgba(111,227,212,0.3);
    color:var(--cyan); width:44px; height:44px; font-family:inherit; font-size:20px;
    cursor:pointer; line-height:1; z-index:2;
    transition:background .2s ease, border-color .2s ease;
  }
  .lightboxNav:hover{ background:rgba(111,227,212,0.15); border-color:var(--cyan); }
  #lightboxPrev{ left:18px; } #lightboxNext{ right:18px; }
  #lightboxCounter{
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:0.12em; color:var(--dim);
  }

  /* ---------- contact fields ---------- */
  #panelFields{ display:none; margin:0 0 24px; }
  #panelFields.show{ display:block; }
  .fieldRow{ display:flex; gap:14px; padding:9px 0; border-bottom:1px solid rgba(111,227,212,0.12); font-size:12.5px; }
  .fieldRow .fieldLabel{ color:var(--cyan); letter-spacing:0.12em; min-width:78px; flex-shrink:0; }
  .fieldRow .fieldValue{ color:var(--dim); word-break:break-word; }
  #panelTags{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  #panelTags span{
    font-size:10px; letter-spacing:0.1em; color:var(--blue);
    border:1px solid rgba(90,127,163,0.4); padding:4px 9px;
  }
  #panelClose{
    background:none; border:none; color:var(--dim); font-family:inherit;
    font-size:11px; letter-spacing:0.14em; cursor:pointer; padding:0;
    border-bottom:1px solid transparent;
  }
  #panelClose:hover{ color:var(--cyan); border-color:var(--cyan); }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(111,227,212,0.2); }
</style>
</head>
<body>

<div id="world"></div>

<div id="hud">
  <div id="mark">aliSaffari<b>:// </b> a World</div>
  <div id="coords">SECTOR <span id="cx">0000</span>.<span id="cz">0000</span></div>
  <div id="hint">DRAG OR USE ARROW KEYS TO EXPLORE &nbsp;·&nbsp; Q/E OR ⟲⟳ TO ROTATE THE VIEW &nbsp;·&nbsp; TAP A SIGN TO OPEN IT</div>
</div>

<button id="rotateLeftBtn" aria-label="Rotate view left">⟲</button>
<button id="rotateRightBtn" aria-label="Rotate view right">⟳</button>
<button id="povToggleBtn" aria-label="Toggle first-person walking mode">WALK / POV</button>
<button id="screenshotBtn" aria-label="Take a screenshot">
  <svg viewBox="0 0 24 24" width="19" height="19">
    <path d="M3 9 V3 H9 M15 3 H21 V9 M21 15 V21 H15 M9 21 H3 V15"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
  </svg>
</button>
<div id="captureFlash"></div>
<div id="captureToast">SAVED</div>
<div id="crosshair"></div>
<div id="joystick">
  <div id="joystickBase"></div>
  <div id="joystickThumb"></div>
</div>

<div id="boot">
  <pre id="bootLog"><span class="cursor"></span></pre>
</div>

<div id="panelLayer">
  <div id="panel">
    <div id="panelInner">
      <div id="panelEyebrow">_OPEN</div>
      <h2 id="panelTitle"></h2>
      <p id="panelTagline"></p>

      <div id="panelGallery">
        <div id="galleryFrame">
          <img id="galleryImg" alt="" draggable="false" />
          <button id="galleryExpand" aria-label="View fullscreen" title="View fullscreen">
            <svg viewBox="0 0 24 24" width="15" height="15">
              <path d="M3 9 V3 H9 M15 3 H21 V9 M21 15 V21 H15 M9 21 H3 V15"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <button id="galleryPrev" class="galleryNav" aria-label="previous">&lt;</button>
        <button id="galleryNext" class="galleryNav" aria-label="next">&gt;</button>

      </div>

      <p id="panelBody"></p>
      <div id="panelFields"></div>
      <div id="panelTags"></div>
      <button id="panelClose">&lt; CLOSE_</button>
    </div>
  </div>
</div>

<div id="lightbox">
  <img id="lightboxImg" alt="" draggable="false" />
  <button id="lightboxClose" aria-label="Close fullscreen">&times;</button>
  <button id="lightboxPrev" class="lightboxNav" aria-label="previous">&lt;</button>
  <button id="lightboxNext" class="lightboxNav" aria-label="next">&gt;</button>
  <div id="lightboxCounter"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* =========================================================================
   CONTENT — edit this array to change what lives in the world.
   Each entry becomes a glowing, clickable sign somewhere in the city.
   ========================================================================= */
const DISTRICTS = [
  { id:'the CORE',    sign:'the CORE', title:'the CORE', tagline:'An optical study of light as image.',
    body:'The Core investigates the optical mechanisms that make photography possible. Through the use of lenses, telescopes, and other optical devices, the series examines light not as a means of representation but as the primary subject of the image. By foregrounding optical phenomena such as refraction, reflection, magnification, and distortion, the work shifts attention from the photographed world to the physical processes through which photographs are produced.',
    tags:['Optics','Light','Abstraction'], gallery:32 },
  { id:'Same World, Another Camera',      sign:'Same World, Another Camera', title:'Same World, Another Camera', tagline:'The familiar city reinterpreted through infrared photography.',
    body:'Same World, Another Camera explores urban spaces and anonymous portraits through a modified infrared camera. Recording wavelengths beyond human vision, the camera transforms familiar scenes into unfamiliar images. The project investigates how changes in photographic technology reshape the perception of the same world.',
    tags:['Infrared','Perception'], gallery:32 },
  { id:'Same Camera, Another World',          sign:'Same Camera, Another World', title:'Same Camera, Another World', tagline:'Urban landscapes shaped by distance, solitude, and the experience of being out of place.',
    body:'Same Camera, Another World presents quiet urban landscapes shaped by absence and distance. Empty streets, overlooked spaces, and moments of isolation transform familiar environments into unfamiliar places. Rather than documenting the city, the series reflects on the emotional experience of moving through it.',
    tags:['Urban Landscape','Solitude','Belonging'], gallery:10 },
  { id:'Once Upon a TIME',  sign:'Once Upon a TIME', title:'Once Upon a TIME', tagline:'Archived images revisited through rephotography and reframing.',
    body:'Once Upon a Time is based on archived slide photographs that have been rephotographed and reframed. By isolating fragments of existing images, the project shifts attention from the original photograph to the act of selection and reinterpretation. The resulting images exist between archive and authorship, where photography becomes a process of rediscovery rather than documentation.',
    tags:['Archive','Rephotography'], gallery:16 },
  { id:'Drivers',   sign:'Drivers', title:'Drivers', tagline:'Portraits encountered through a digital platform and reintroduced as photographs.',
    body:'Drivers explores profile photographs of ride-hailing drivers as contemporary portraits. By rephotographing these digital images, the project shifts them from a functional interface into a photographic context, raising questions about identity, representation, and the role of images in everyday digital life.',
    tags:['Identity','Portrait'], gallery:8 },
  // this one isn't mixed in with the other districts — it's planted as a
  // landmark at the far southern edge, the very bottom of the map.
  { id:'transmit',     sign:'CONTACT_ME', title:'Contact', tagline:'Open a channel.', contact:true,
    fields:[
      { label:'NAME',   value:'— Ali Saffari —' },
      { label:'EMAIL',  value:'— saffari.ali1@gmail.com —' },
      { label:'SOCIAL', value:'— add a handle or link —' },
      { label:'NOTE',   value:'Reach out any time — this signal is monitored.' },
    ],
    tags:['contact'] },
];

const ADS = ['SIGNAL_WEAK','v4.02 STABLE','RUN://EARTH 2.4.exe','NODE_4 ACTIVE','ENCRYPTION: OFF','THERE YOU ARE!'];

/* =========================================================================
   BASIC SETUP
   ========================================================================= */
const container = document.getElementById('world');
const COLORS = { bg:0x030507, cyan:0x6fe3d4, green:0x5bc98a, blue:0x5a7fa3, white:0xeaf5f2, dark:0x0a0d10 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(COLORS.bg);
scene.fog = new THREE.FogExp2(COLORS.bg, 0.013);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, logarithmicDepthBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
function applyRendererSize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
}
applyRendererSize();
container.appendChild(renderer.domElement);
renderer.domElement.style.position = "fixed";
renderer.domElement.style.left = "0";
renderer.domElement.style.top = "0";
renderer.domElement.style.width = "100vw";
renderer.domElement.style.height = "100vh";

// isometric orthographic camera
const FRUSTUM = 20;
let aspect = window.innerWidth/window.innerHeight;
const isoCamera = new THREE.OrthographicCamera(-FRUSTUM*aspect/2, FRUSTUM*aspect/2, FRUSTUM/2, -FRUSTUM/2, -1000, 2000);
const ISO_OFFSET_BASE = new THREE.Vector3(24, 24, 24);
const ISO_OFFSET = new THREE.Vector3();
let camZoom = 0.2;
let camZoomTarget = 0.2;
const ZOOM_MIN = 0.18, ZOOM_MAX = 5.5;

// first-person / POV camera — walks the streets at eye level. Kept as a
// completely separate camera object so the isometric view is untouched;
// toggling POV just swaps which one is active for rendering + raycasting.
const povCamera = new THREE.PerspectiveCamera(72, aspect, 0.03, 260);
const POV_EYE_HEIGHT = 0.46; // roughly a pedestrian's eye level at this world scale
const POV_RADIUS = 0.11;     // collision radius used to keep the player out of buildings
let povActive = false;
let povYaw = 0, povPitch = 0;

// the camera currently fed to the renderer / raycaster — starts isometric
let camera = isoCamera;

// horizontal orbit — lets the whole city be spun around so every side of
// every building (and whatever sits behind you) can be seen
const Y_AXIS = new THREE.Vector3(0,1,0);
let camYaw = 0, camYawTarget = 0;
function rotateView(dir){
  if(povActive){ povYawTarget += dir * (Math.PI/2); return; }
  camYawTarget += dir * (Math.PI/2);
}

const rig = new THREE.Object3D(); // the point the player controls; camera orbits above it
scene.add(rig);

function updateCamera(dt){
  // ease the yaw toward its target — smooth quarter-turns instead of snapping
  const yawEase = 1 - Math.pow(0.0008, dt || 0.016);
  camYaw += (camYawTarget - camYaw) * yawEase;

  ISO_OFFSET.copy(ISO_OFFSET_BASE).applyAxisAngle(Y_AXIS, camYaw);
  isoCamera.position.copy(rig.position).add(ISO_OFFSET);
  isoCamera.lookAt(rig.position.x, rig.position.y + 1.2, rig.position.z);
  // ease toward the target zoom instead of snapping — frame-rate independent smoothing
  const zoomEase = 1 - Math.pow(0.0025, dt || 0.016);
  camZoom += (camZoomTarget - camZoom) * zoomEase;
  isoCamera.zoom = camZoom;
  isoCamera.updateProjectionMatrix();

  // keep movement/pan axes screen-relative as the view spins
  FORWARD.copy(FORWARD_BASE).applyAxisAngle(Y_AXIS, camYaw);
  RIGHT.copy(RIGHT_BASE).applyAxisAngle(Y_AXIS, camYaw);
}

/* =========================================================================
   POV / WALK MODE — first-person camera that walks the streets at eye
   level, with mouse/touch drag to look around (game-style) and WASD, arrow
   keys, or an on-screen thumbstick to move. Simple circle-vs-box collision
   keeps the player from walking through building footprints.
   ========================================================================= */
let povYawTarget = 0, povPitchTarget = 0;
const POV_PITCH_LIMIT = 1.35;
const povForward = new THREE.Vector3();
const povRight = new THREE.Vector3();
const povLookDir = new THREE.Vector3();

function updatePovDirs(){
  povForward.set(Math.sin(povYaw), 0, Math.cos(povYaw));
  povRight.set(-Math.cos(povYaw), 0, Math.sin(povYaw));
}
updatePovDirs();

function resolvePovCollisions(){
  for(const c of COLLIDERS){
    const dx = rig.position.x - c.x, dz = rig.position.z - c.z;
    const ax = Math.abs(dx), az = Math.abs(dz);
    if(ax > c.hw + POV_RADIUS || az > c.hd + POV_RADIUS) continue; // no overlap, cheap early-out
    // push out along whichever axis has the least penetration
    const overlapX = c.hw + POV_RADIUS - ax;
    const overlapZ = c.hd + POV_RADIUS - az;
    if(overlapX < overlapZ){
      rig.position.x += (dx < 0 ? -overlapX : overlapX);
    } else {
      rig.position.z += (dz < 0 ? -overlapZ : overlapZ);
    }
  }
}

let povWalkPhase = 0;      // advances only while actually moving — drives the head-bob
let povSpeedCurrent = 0;   // eased current walking speed, for smooth accel/decel
const BOB_AMP = 0.02, BOB_FREQ = 9.5;

function updatePovCamera(dt){
  const lookEase = 1 - Math.pow(0.0004, dt || 0.016);
  povYaw += (povYawTarget - povYaw) * lookEase;
  povPitch += (povPitchTarget - povPitch) * lookEase;
  updatePovDirs();

  const bobMul = Math.min(1, povSpeedCurrent / 2.6);
  const bob = bobMul > 0.02 ? Math.sin(povWalkPhase) * BOB_AMP * bobMul : 0;
  povCamera.position.set(rig.position.x, POV_EYE_HEIGHT + bob, rig.position.z);
  povLookDir.set(
    Math.sin(povYaw) * Math.cos(povPitch),
    Math.sin(povPitch),
    Math.cos(povYaw) * Math.cos(povPitch)
  );
  povCamera.lookAt(
    povCamera.position.x + povLookDir.x,
    povCamera.position.y + povLookDir.y,
    povCamera.position.z + povLookDir.z
  );
}

function enterPov(){
  if(povActive) return;
  // face the same general direction the isometric camera was looking, so
  // the switch doesn't feel like a random teleport
  povYaw = povYawTarget = Math.atan2(-ISO_OFFSET.x, -ISO_OFFSET.z);
  povPitch = povPitchTarget = -0.04;
  povSpeedCurrent = 0; povWalkPhase = 0;
  updatePovDirs();
  resolvePovCollisions();
  povActive = true;
  camera = povCamera;
  document.body.classList.add('pov-active');
  hint.textContent = 'DRAG TO LOOK AROUND \u00b7 WASD OR THE STICK TO WALK \u00b7 LOOK AT A SIGN AND TAP TO OPEN';
  hint.style.opacity = '1';
  clearTimeout(hintFadeTimer);
  hintFadeTimer = setTimeout(()=>{ hint.style.opacity = '0'; }, 4500);
  povToggleBtn.classList.add('active');
  povToggleBtn.textContent = 'MAP VIEW';
}

function exitPov(){
  if(!povActive) return;
  povActive = false;
  camera = isoCamera;
  document.body.classList.remove('pov-active');
  joystickActive = false;
  joystickThumb.style.transform = 'translate(-50%,-50%)';
  hint.textContent = 'DRAG OR USE ARROW KEYS TO EXPLORE · Q/E OR ⟲⟳ TO ROTATE THE VIEW · TAP A GLOWING SIGN TO OPEN IT';
  hint.style.opacity = '1';
  clearTimeout(hintFadeTimer);
  hintFadeTimer = setTimeout(()=>{ hint.style.opacity = '0'; }, 4000);
  povToggleBtn.classList.remove('active');
  povToggleBtn.textContent = 'WALK / POV';
}

function togglePov(){ povActive ? exitPov() : enterPov(); }

// isometric-relative movement axes — rotated live to match camYaw (see updateCamera)
const FORWARD_BASE = new THREE.Vector3(-1,0,-1).normalize();
const RIGHT_BASE   = new THREE.Vector3(1,0,-1).normalize();
const FORWARD = FORWARD_BASE.clone();
const RIGHT   = RIGHT_BASE.clone();

/* =========================================================================
   PROCEDURAL TEXTURES — everything below is generated on the fly, nothing
   is loaded from disk, which keeps the world feeling code-native.
   ========================================================================= */
const GLYPHS = '01#$%&*+=-/\\<>[]{}~^:;'.split('');
const CODE_TOKENS = ['func','if','else','for','while','const','let','return','0x1F','0xFF','true','false','null','import','class','async','await','try','catch','=>','!==','&&','||','...','void','new','this'];

function codeChar(){
  // mostly single glyphs, occasionally a short recognizable code token —
  // reads as real streaming code rather than random noise
  return Math.random() < 0.12 ? CODE_TOKENS[(Math.random()*CODE_TOKENS.length)|0] : GLYPHS[(Math.random()*GLYPHS.length)|0];
}

function makeWindowTexture(tint, w=384, h=768, density=0.22){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  // flat, near-black facade base — PS1-era buildings used one or two flat
  // shaded panel colors rather than gradients, so the base stays solid
  ctx.fillStyle = '#0a0e11'; ctx.fillRect(0,0,w,h);

  // coarse, blocky panel noise — a cheap low-res "concrete/cladding" texture
  // in the chunky, undithered style of PS1-era building facades. Kept subtle
  // so the facade itself stays dark and the lit windows are what pop.
  const noiseCell = 8;
  for(let ny=0; ny<h; ny+=noiseCell){
    for(let nx=0; nx<w; nx+=noiseCell){
      if(Math.random() < 0.35){
        const s = 2 + ((Math.random()*5)|0);
        ctx.fillStyle = `rgba(${14+s},${19+s},${22+s},0.4)`;
        ctx.fillRect(nx, ny, noiseCell, noiseCell);
      }
    }
  }

  // window grid — most bays are dark/off; only a modest fraction glow, like
  // a real building at night rather than a fully lit-up billboard
  const floorH = 44, bayW = 34;
  const floors = Math.floor(h/floorH), bays = Math.floor(w/bayW);

  for(let f=0; f<floors; f++){
    const y = f*floorH;
    for(let b=0; b<bays; b++){
      const x = b*bayW;
      const lit = Math.random() < density;
      const pad = 3, ww = bayW-pad*2, wh = floorH-pad*2;

      // window frame / mullion, always dark
      ctx.fillStyle = '#04070a';
      ctx.fillRect(x+pad-1, y+pad-1, ww+2, wh+2);

      if(lit){
        ctx.fillStyle = tint.replace('ALPHA', (0.32+Math.random()*0.28).toFixed(2));
        ctx.fillRect(x+pad, y+pad, ww, wh);
        // simple cross mullion splitting the pane, blocky PS1-style detail
        ctx.fillStyle = 'rgba(3,5,6,0.65)';
        ctx.fillRect(x+pad+ww/2-1, y+pad, 2, wh);
      } else {
        ctx.fillStyle = 'rgba(8,11,14,0.92)';
        ctx.fillRect(x+pad, y+pad, ww, wh);
        ctx.strokeStyle = 'rgba(110,140,140,0.06)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x+pad+0.5, y+pad+0.5, ww-1, wh-1);
      }
    }
  }

  // crown / parapet cap and a soft shadow along the base
  ctx.fillStyle = 'rgba(4,7,9,0.92)';
  ctx.fillRect(0,0,w,9);
  ctx.strokeStyle = tint.replace('ALPHA','0.35');
  ctx.beginPath(); ctx.moveTo(0,9.5); ctx.lineTo(w,9.5); ctx.stroke();
  const gshadow = ctx.createLinearGradient(0,h-42,0,h);
  gshadow.addColorStop(0,'rgba(0,0,0,0)');
  gshadow.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle = gshadow; ctx.fillRect(0,h-42,w,42);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  // repeat is intentionally left at (1,1): each building bakes its own
  // UVs (see mergeBuildingFaces) sized to its real width/height/depth, so
  // the window pattern tiles at a constant, undistorted texel density
  // instead of being stretched to fit whatever box it happens to be
  // applied to. NearestFilter on magnification keeps every window edge
  // crisp and blocky up close (low-res PS1 texture look) instead of the
  // smeared, photo-like blur that bilinear filtering produces; mipmapped
  // minification still keeps things clean and shimmer-free at a distance.
  tex.magFilter = THREE.NearestFilter;
  tex.anisotropy = 8;
  return tex;

}

function makeGroundTexture(){
  const w=512,h=512;
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#080b0d'; ctx.fillRect(0,0,w,h);
  const cell = 32;
  ctx.strokeStyle = 'rgba(111,227,212,0.16)';
  ctx.lineWidth = 1;
  for(let x=0;x<=w;x+=cell){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for(let y=0;y<=h;y+=cell){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  // scattered stray characters, like debug print-outs on the pavement
  ctx.font = '11px monospace';
  for(let i=0;i<160;i++){
    ctx.fillStyle = `rgba(91,201,138,${(0.08+Math.random()*0.18).toFixed(2)})`;
    ctx.fillText(GLYPHS[(Math.random()*GLYPHS.length)|0], Math.random()*w, Math.random()*h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(14,14);
  return tex;
}

function makeGlyphTexture(char, color){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.font = '46px "JetBrains Mono", monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor = color; ctx.shadowBlur = 14;
  ctx.fillStyle = color;
  ctx.fillText(char, 32, 34);
  return new THREE.CanvasTexture(c);
}

function makeTextTexture(text, opts={}){
  const { fg='#6fe3d4', size=46, pad=18, weight=500 } = opts;
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = `${weight} ${size}px "JetBrains Mono", monospace`;
  const tw = Math.ceil(measure.measureText(text).width);
  const c = document.createElement('canvas');
  c.width = tw + pad*2; c.height = size + pad*2;
  const ctx = c.getContext('2d');
  ctx.font = `${weight} ${size}px "JetBrains Mono", monospace`;
  ctx.textBaseline='middle';
  ctx.shadowColor = fg; ctx.shadowBlur = 18;
  ctx.fillStyle = fg;
  ctx.fillText(text, pad, c.height/2);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return { texture:tex, aspect:c.width/c.height };
}

function makeGlowTexture(){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(111,227,212,0.9)');
  g.addColorStop(0.4,'rgba(111,227,212,0.25)');
  g.addColorStop(1,'rgba(111,227,212,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

/* gallery placeholder frames — procedurally drawn so the gallery matches the
   world's visual language until real project images are dropped in later. */
function makeGalleryImage(index, tint, label){
  const w=480, h=300;
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,'#131b20'); grad.addColorStop(1,'#050709');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = 'rgba(111,227,212,0.09)';
  for(let x=0;x<w;x+=24){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for(let y=0;y<h;y+=24){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

  ctx.font = '12px monospace';
  for(let i=0;i<200;i++){
    ctx.fillStyle = tint.replace('ALPHA', (0.08+Math.random()*0.26).toFixed(2));
    ctx.fillText(GLYPHS[(Math.random()*GLYPHS.length)|0], Math.random()*w, Math.random()*h);
  }

  ctx.strokeStyle = tint.replace('ALPHA','0.55');
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  const cx = w*(0.28 + 0.44*(((index*53)%97)/97));
  ctx.arc(cx, h*0.5, 46+((index*29)%54), 0, Math.PI*2);
  ctx.stroke();

  ctx.font = '600 15px "JetBrains Mono", monospace';
  ctx.fillStyle = tint.replace('ALPHA','0.95');
  ctx.shadowColor = tint.replace('ALPHA','1'); ctx.shadowBlur = 10;
  ctx.fillText(`${label} · FRAME_${String(index+1).padStart(2,'0')}`, 16, h-16);

  return c.toDataURL();
}

/* real project photos live in:  images/<district id>/1.jpg, 2.jpg, 3.jpg ...

   supported extensions: .jpg .jpeg .png .webp (first one found per index wins) */
const GALLERY_TINTS = ['rgba(111,227,212,ALPHA)','rgba(91,201,138,ALPHA)','rgba(90,127,163,ALPHA)','rgba(234,245,242,ALPHA)'];
const GALLERY_EXTENSIONS = ['jpg','jpeg','png','webp'];

function findRealImage(id, index){
  return new Promise(resolve=>{
    const url = `/aWorld/images/${encodeURIComponent(id)}/${index + 1}.webp`;
    const img = new Image();

    img.onload = () => resolve(url);
    img.onerror = () => resolve(null);

    img.src = url;
  });
}

DISTRICTS.forEach((d,i)=>{

  d.images = Array.from({ length: d.gallery }, (_, k) => makeGalleryImage(k, tint, d.title.toUpperCase()));
  // then swap in any real photo found on disk for each slot, as soon as it loads
  d.images.forEach((_, k)=>{

    });
  });
});

{

/* =========================================================================
   BUILDINGS — instanced per texture variant, grown from ground on boot
   ========================================================================= */
const CITY_HALF = 46;
const CELL = 3.6;
const boxGeo = new THREE.BoxGeometry(1,1,1);
boxGeo.translate(0,0.5,0); // pivot at base so scale.y grows upward

const buildingMeshes = buildingTexVariants.map(tex=>{
  const mat = new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff });
  const mesh = new THREE.InstancedMesh(boxGeo, mat, 400);
  mesh.count = 0;
  scene.add(mesh);
  return mesh;
});

const edgeGeo = new THREE.EdgesGeometry(boxGeo);
const edgeTints = [0x6fe3d4, 0x5bc98a, 0x5a7fa3, 0xeaf5f2];

// world units represented by one full tile of the window texture —
// buildings bake their own UVs from these constants (see mergeBuildingFaces
// and the special-shape builders below) instead of stretching a shared
// 0..1 UV across whatever size box they happen to be, so the window
// pattern always reads at the same crisp, undistorted density.
const TEX_UNIT_U = 1.6;
const TEX_UNIT_V = 1.8;

// clone the shared facade texture with its own repeat, for meshes that
// aren't part of the instanced/merged box pipeline (cones, tiered towers)
function cloneFacadeTexture(baseTex, repeatU, repeatV){
  const tex = baseTex.clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.NearestFilter;
  tex.repeat.set(Math.max(0.3, repeatU), Math.max(0.3, repeatV));
  return tex;
}

// flat, windowless roof material — rooftops and the undersides of setbacks
// read as solid concrete/tar rather than more windows facing the sky
const capMat = new THREE.MeshBasicMaterial({ color: 0x0a0f12 });

/* -------------------------------------------------------------------------
   SPECIAL SILHOUETTES — a handful of buildings break from the plain box:
   tapering conical towers and tiered, New-York-style setback skyscrapers,
   both built as low-poly standalone meshes wearing the same window facade.
   ------------------------------------------------------------------------- */
function createConeTower(x, z, w, d, h, variant){
  const group = new THREE.Group();
  const baseR = Math.max(w,d)/2;
  const topR = baseR*0.3;
  const segs = Math.random()<0.5 ? 6 : 8; // low-poly, faceted PS1 look

  const geo = new THREE.CylinderGeometry(topR, baseR, h, segs, 1);
  geo.translate(0, h/2, 0);
  const tex = cloneFacadeTexture(buildingTexVariants[variant], (2*Math.PI*baseR)/TEX_UNIT_U, h/TEX_UNIT_V);
  // CylinderGeometry groups faces as [0: side, 1: top cap, 2: bottom cap] —
  // give the side the window facade and cap both ends with flat roof material
  const mesh = new THREE.Mesh(geo, [new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff }), capMat, capMat]);
  group.add(mesh);

  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: edgeTints[variant], transparent:true, opacity:0.5 }));
  group.add(edge);

  // rooftop spire/antenna, same visual language as the box buildings' roof props
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.05,1.1,5), new THREE.MeshBasicMaterial({ color: 0x0c1216 }));
  spire.position.y = h + 0.5;
  group.add(spire);
  const spireEdge = new THREE.LineSegments(new THREE.EdgesGeometry(spire.geometry), new THREE.LineBasicMaterial({ color: edgeTints[variant], transparent:true, opacity:0.45 }));
  spireEdge.position.copy(spire.position);
  group.add(spireEdge);

  group.position.set(x,0,z);
  return group;
}

function createSetbackTower(x, z, w, d, h, variant){
  const group = new THREE.Group();
  const tierCount = Math.random()<0.5 ? 3 : 4;
  let tw = w, td = d, y = 0;

  for(let i=0; i<tierCount; i++){
    const isLast = i === tierCount-1;
    const th = isLast ? Math.max(h - y, 0.8) : h*(0.22 + Math.random()*0.12);
    const geo = new THREE.BoxGeometry(tw, th, td);
    const tex = cloneFacadeTexture(buildingTexVariants[variant], ((tw+td)/2)/TEX_UNIT_U, th/TEX_UNIT_V);
    const wallMat = new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff });
    // BoxGeometry groups faces as [+x,-x,+y,-y,+z,-z] — cap only the top
    // (+y) with flat roof material so each setback ledge isn't windowed
    const mesh = new THREE.Mesh(geo, [wallMat, wallMat, capMat, wallMat, wallMat, wallMat]);
    mesh.position.set(0, y + th/2, 0);
    group.add(mesh);
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: edgeTints[variant], transparent:true, opacity:0.5 }));
    edge.position.copy(mesh.position);
    group.add(edge);

    y += th;
    if(!isLast){ tw *= 0.68 + Math.random()*0.1; td *= 0.68 + Math.random()*0.1; }
  }

  // thin needle spire on top, the classic New-York skyscraper silhouette
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.025,1.4,5), new THREE.MeshBasicMaterial({ color: 0x0c1216 }));
  spire.position.y = y + 0.7;
  group.add(spire);
  const spireEdge = new THREE.LineSegments(new THREE.EdgesGeometry(spire.geometry), new THREE.LineBasicMaterial({ color: edgeTints[variant], transparent:true, opacity:0.45 }));
  spireEdge.position.copy(spire.position);
  group.add(spireEdge);

  group.position.set(x,0,z);
  return group;
}

const buildingData = []; // {mesh, index, w,d,h, x,z, delay, edge}
const specialBuildings = []; // {group, delay} — cone towers & setback skyscrapers
// flat footprint list used only for POV walking collision — every building,
// regular or special, contributes one axis-aligned box here
const COLLIDERS = []; // {x,z,hw,hd}
{
  const dummy = new THREE.Object3D();
  const counters = [0,0,0,0];
  let n = 0;
  for(let gx=-12; gx<=12; gx++){
    for(let gz=-12; gz<=12; gz++){
      // leave every 3rd row/col open as a street, and skip the very center for a plaza
      if(gx % 3 === 0 || gz % 3 === 0) continue;
      if(Math.abs(gx) + Math.abs(gz) < 2) continue;
      if(Math.random() > 0.93) continue;
      const x = gx*CELL, z = gz*CELL;
      const h = 2 + Math.random()*Math.random()*13;
      const w = 1.6 + Math.random()*1.3;
      const d = 1.6 + Math.random()*1.3;

      // occasionally swap a tall building for a more elaborate silhouette —
      // a tapering conical tower or a tiered, New-York-style setback tower
      if(h > 8 && Math.random() < 0.1){
        const specialVariant = (Math.random()*buildingMeshes.length)|0;
        const special = Math.random() < 0.5
          ? createConeTower(x,z,w,d,h,specialVariant)
          : createSetbackTower(x,z,w,d,h,specialVariant);
        special.scale.set(0.001,0.001,0.001);
        scene.add(special);
        specialBuildings.push({ group: special, delay: Math.random()*0.4 });
        COLLIDERS.push({ x, z, hw: w/2, hd: d/2 });
        n++;
        continue;
      }

      const variant = n % buildingMeshes.length;
      const mesh = buildingMeshes[variant];
      const idx = counters[variant]++;
      if(idx >= mesh.instanceMatrix.count) continue;
      dummy.position.set(x,0,z);
      dummy.scale.set(w,0.001,d);
      dummy.updateMatrix();
      mesh.setMatrixAt(idx, dummy.matrix);

      // glowing wireframe outline — reads instantly even at low light
      const edgeMat = new THREE.LineBasicMaterial({ color: edgeTints[variant], transparent:true, opacity:0.55 });
      const edge = new THREE.LineSegments(edgeGeo, edgeMat);
      edge.position.set(x,0,z);
      edge.scale.set(w,0.001,d);
      scene.add(edge);

      // rooftop prop on some of the taller buildings — antenna, tank, vent
      // block — cheap low-poly detail for a more believable skyline
      let roof = null;
      if(h > 5 && Math.random() < 0.4){
        const kind = Math.random();
        const roofMat = new THREE.MeshBasicMaterial({ color: 0x0c1216 });
        if(kind < 0.4){
          roof = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.9,5), roofMat); // antenna
        } else if(kind < 0.75){
          roof = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.4,8), roofMat); // tank
        } else {
          roof = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.3,0.5), roofMat); // vent block
        }
        const roofEdge = new THREE.LineSegments(new THREE.EdgesGeometry(roof.geometry), new THREE.LineBasicMaterial({ color: edgeTints[variant], transparent:true, opacity:0.45 }));
        roof.add(roofEdge);
        roof.position.set(x + (Math.random()-0.5)*w*0.4, 0, z + (Math.random()-0.5)*d*0.4);
        roof.visible = false;
        scene.add(roof);
      }

      buildingData.push({ mesh, idx, w,h,d, x,z, delay: Math.random()*0.4, edge, roof, variant });
      COLLIDERS.push({ x, z, hw: w/2, hd: d/2 });
      n++;
    }

/* =========================================================================
   ROADS & SIDEWALKS — a real paved cross-section along every street: a
   lighter sidewalk band next to the buildings on both sides, a darker
   asphalt road in the middle (where the cars actually drive), a glowing
   curb line at the boundary, and a dashed centre lane line. This is a thin
   decal sitting just above the base ground plane — it's purely visual and
   doesn't change movement or collision.
   ========================================================================= */
const ROAD_HALF = 1.15;        // half-width of the asphalt/car lane
const SIDEWALK_HALF = 1.65;    // half-width of the full corridor incl. sidewalks
const ROAD_TILE_LEN = 1.0;     // world length of one dash+gap tile
const CORRIDOR_LEN = (CITY_HALF + CELL*1.5) * 2; // full length a corridor spans

function drawRoadProfile(ctx, w, h, alongIsY){
  const across = alongIsY ? w : h; // the narrow, non-repeating dimension
  const along  = alongIsY ? h : w; // the long, tiled dimension
  const pxPerUnitAcross = across / (SIDEWALK_HALF*2);

  // sidewalk base, full strip
  ctx.fillStyle = '#141c20';
  ctx.fillRect(0,0,w,h);

  // faint paver seams — painted over by the road fill below wherever it overlaps
  ctx.strokeStyle = 'rgba(111,227,212,0.10)';
  ctx.lineWidth = 1;
  const seamStep = 0.45 * pxPerUnitAcross;
  for(let s=seamStep; s<along; s+=seamStep){
    ctx.beginPath();
    if(alongIsY){ ctx.moveTo(0,s); ctx.lineTo(w,s); } else { ctx.moveTo(s,0); ctx.lineTo(s,h); }
    ctx.stroke();
  }

  // asphalt road band, centred across the strip
  const roadPx = ROAD_HALF * pxPerUnitAcross;
  const centerAcross = across/2;
  ctx.fillStyle = '#08090b';
  if(alongIsY) ctx.fillRect(centerAcross-roadPx, 0, roadPx*2, h);
  else ctx.fillRect(0, centerAcross-roadPx, w, roadPx*2);

  // curb glow at the sidewalk/road boundary
  ctx.strokeStyle = 'rgba(111,227,212,0.32)';
  ctx.lineWidth = Math.max(1, 0.035*pxPerUnitAcross);
  ctx.beginPath();
  if(alongIsY){
    ctx.moveTo(centerAcross-roadPx,0); ctx.lineTo(centerAcross-roadPx,h);
    ctx.moveTo(centerAcross+roadPx,0); ctx.lineTo(centerAcross+roadPx,h);
  } else {
    ctx.moveTo(0,centerAcross-roadPx); ctx.lineTo(w,centerAcross-roadPx);
    ctx.moveTo(0,centerAcross+roadPx); ctx.lineTo(w,centerAcross+roadPx);
  }
  ctx.stroke();

  // dashed centre lane line, glowing like the rest of the world's wireframe accents
  ctx.strokeStyle = 'rgba(91,201,138,0.9)';
  ctx.lineWidth = Math.max(1.5, 0.05*pxPerUnitAcross);
  ctx.shadowColor = 'rgba(91,201,138,0.8)';
  ctx.shadowBlur = 3;
  const dashLen = 0.55*along;
  ctx.beginPath();
  if(alongIsY){ ctx.moveTo(centerAcross,0); ctx.lineTo(centerAcross,dashLen); }
  else { ctx.moveTo(0,centerAcross); ctx.lineTo(dashLen,centerAcross); }
  ctx.stroke();
}

function makeRoadTexture(vertical){
  const acrossPx = 216, tilePx = 72;
  const w = vertical ? acrossPx : tilePx;
  const h = vertical ? tilePx : acrossPx;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  drawRoadProfile(c.getContext('2d'), w, h, vertical);
  const tex = new THREE.CanvasTexture(c);
  if(vertical){ tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, CORRIDOR_LEN/ROAD_TILE_LEN); }
  else { tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping; tex.repeat.set(CORRIDOR_LEN/ROAD_TILE_LEN, 1); }
  return tex;
}

// raised curbs along every sidewalk/road boundary — real 3D geometry, not
// just a painted line — broken into block-length segments so they don't
// run straight across the middle of a perpendicular street
const CURB_HEIGHT = 0.035, CURB_WIDTH = 0.05;
function curbSegments(){
  const half = CORRIDOR_LEN/2, gap = ROAD_HALF + CROSSWALK_DEPTH;
  const cuts = [-half, ...STREET_COORDS, half];
  const segs = [];
  for(let i=0;i<cuts.length-1;i++){
    let a = cuts[i], b = cuts[i+1];
    if(i>0) a += gap;
    if(i<cuts.length-2) b -= gap;
    if(b > a) segs.push([a,b]);
  }
  return segs;
}

/* =========================================================================
   TRAFFIC LIGHTS — a simple, deterministic stop/go cycle per intersection.
   Each intersection gets its own time offset (hashed from its coordinates)
   so the whole city doesn't switch in unison; cars and pedestrians heading
   the "red" way for that intersection ease to a stop at the line, and
   anything already inside the intersection is always let through.
   ========================================================================= */
const TRAFFIC_CYCLE = 9; // seconds for a full light cycle
function trafficHorizontalGreen(ix, iz, time){
  const h = Math.sin(ix*12.9898 + iz*78.233) * 43758.5453;
  const offset = (h - Math.floor(h)) * TRAFFIC_CYCLE;
  return ((time + offset) % TRAFFIC_CYCLE) < TRAFFIC_CYCLE/2;
}
function intersectionSpeedMul(pos, dir, lane, horizontal, stopSetback, rampDist, time){
  for(const cross of STREET_COORDS){
    const distAhead = (cross - pos) * dir;
    if(distAhead > stopSetback && distAhead < rampDist){
      const ix = horizontal ? cross : lane, iz = horizontal ? lane : cross;
      const green = trafficHorizontalGreen(ix, iz, time);
      if(horizontal !== green){
        return Math.max(0, (distAhead - stopSetback) / (rampDist - stopSetback));
      }
      break;
    }
  }
  return 1;
}

  taillight.position.set(-0.61, 0.28, 0);

/* =========================================================================
   PEDESTRIANS — small low-poly humanoids (head / torso / arms / legs),
   built like little PS1-era figures rather than plain boxes. Walkers get a
   simple procedural leg/arm swing and move continuously along their street.
   ========================================================================= */
function createPerson(tint){
  const group = new THREE.Group();
  const clothMat = new THREE.MeshBasicMaterial({ color: tint });
  const darkMat = new THREE.MeshBasicMaterial({ color: 0x0b1013 });
  const headMat = new THREE.MeshBasicMaterial({ color: 0xeaf5f2 });

  const hipY = 0.20, legLen = 0.20, torsoH = 0.20, torsoW = 0.15, torsoD = 0.09, headS = 0.105, armLen = 0.17;

  const legGeo = new THREE.BoxGeometry(0.055, legLen, 0.065);
  legGeo.translate(0, -legLen/2, 0); // pivot at hip so it can swing

  const leftLegPivot = new THREE.Group(); leftLegPivot.position.set(-0.045, hipY, 0);
  leftLegPivot.add(new THREE.Mesh(legGeo, darkMat));
  group.add(leftLegPivot);

  const rightLegPivot = new THREE.Group(); rightLegPivot.position.set(0.045, hipY, 0);
  rightLegPivot.add(new THREE.Mesh(legGeo, darkMat));
  group.add(rightLegPivot);

  const torsoGeo = new THREE.BoxGeometry(torsoW, torsoH, torsoD);
  const torso = new THREE.Mesh(torsoGeo, clothMat);
  torso.position.set(0, hipY + torsoH/2, 0);
  group.add(torso);

  const armGeo = new THREE.BoxGeometry(0.045, armLen, 0.05);
  armGeo.translate(0, -armLen/2, 0);
  const shoulderY = hipY + torsoH - 0.02;

  const leftArmPivot = new THREE.Group(); leftArmPivot.position.set(-torsoW/2-0.025, shoulderY, 0);
  leftArmPivot.add(new THREE.Mesh(armGeo, clothMat));
  group.add(leftArmPivot);

  const rightArmPivot = new THREE.Group(); rightArmPivot.position.set(torsoW/2+0.025, shoulderY, 0);
  rightArmPivot.add(new THREE.Mesh(armGeo, clothMat));
  group.add(rightArmPivot);

  const headGeo = new THREE.BoxGeometry(headS, headS, headS);
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.set(0, hipY + torsoH + headS/2 + 0.02, 0);
  group.add(head);
  const headEdge = new THREE.LineSegments(new THREE.EdgesGeometry(headGeo), new THREE.LineBasicMaterial({ color: tint, transparent:true, opacity:0.55 }));
  headEdge.position.copy(head.position);
  group.add(headEdge);

  group.userData.rig = { legL:leftLegPivot, legR:rightLegPivot, armL:leftArmPivot, armR:rightArmPivot };
  return group;
}

const CAT_RADIUS = 0.16;
function resolveCatCollisions(cat){
  for(const c of COLLIDERS){
    const dx = cat.position.x - c.x, dz = cat.position.z - c.z;
    const ax = Math.abs(dx), az = Math.abs(dz);
    if(ax > c.hw + CAT_RADIUS || az > c.hd + CAT_RADIUS) continue;
    const overlapX = c.hw + CAT_RADIUS - ax;
    const overlapZ = c.hd + CAT_RADIUS - az;
    if(overlapX < overlapZ){
      cat.position.x += (dx < 0 ? -overlapX : overlapX);
    } else {
      cat.position.z += (dz < 0 ? -overlapZ : overlapZ);
    }
  }
}

const activePointers = new Map();
let dragging = false, dragMoved = false, lastX=0, lastY=0, downX=0, downY=0, downT=0;
let pinchStartDist = 0, pinchStartZoom = 1;

function getPointerDist(){
  const pts = [...activePointers.values()];
  if(pts.length < 2) return 0;
  return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
}

// look sensitivity for POV drag — tuned so a full-width swipe is roughly
// a 180° turn, which feels natural on both touch and mouse
const LOOK_SENS = Math.PI / Math.max(560, window.innerWidth * 1.6);

container.addEventListener('pointerdown', e=>{
  container.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(activePointers.size === 1){
    dragging = true; dragMoved = false;
    lastX = downX = e.clientX; lastY = downY = e.clientY; downT = performance.now();
    container.classList.add('dragging');
  } else if(activePointers.size === 2 && !povActive){
    pinchStartDist = getPointerDist(); pinchStartZoom = camZoom;
  }
});

container.addEventListener('pointermove', e=>{
  if(!activePointers.has(e.pointerId)) { if(!povActive) handleHover(e); return; }
  activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if(activePointers.size === 2 && !povActive){
    const dist = getPointerDist();
    if(pinchStartDist > 0){
      camZoomTarget = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, pinchStartZoom * (dist/pinchStartDist)));
    }
    return;
  }
  if(dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY) > 6) dragMoved = true;
    if(povActive){
      // first-person look: drag right to turn right, drag up to look up —
      // the same gesture used in nearly every mobile/touch 3D game
      povYawTarget -= dx * LOOK_SENS;
      povPitchTarget = Math.max(-POV_PITCH_LIMIT, Math.min(POV_PITCH_LIMIT, povPitchTarget - dy * LOOK_SENS));
    } else if(dragMoved){
      const speed = 0.028 / camZoom;
      rig.position.addScaledVector(RIGHT, -dx*speed);
      rig.position.addScaledVector(FORWARD, dy*speed);
      clampRig();
    }
    lastX = e.clientX; lastY = e.clientY;
  } else if(!povActive){
    handleHover(e);
  }
});

function endPointer(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size === 0){
    container.classList.remove('dragging');
    if(dragging && !dragMoved && performance.now()-downT < 500){
      if(povActive) handleTapPov(); else handleTap(downX, downY);
    }
    dragging = false;
  }
}
container.addEventListener('pointerup', endPointer);
container.addEventListener('pointercancel', endPointer);

const screenshotBtn = document.getElementById('screenshotBtn');
const captureFlash = document.getElementById('captureFlash');
const captureToast = document.getElementById('captureToast');
let toastTimer = null;

function takeScreenshot(){
  renderer.render(scene, camera); // force one fresh frame right before reading pixels
  captureFlash.classList.add('flash');
  requestAnimationFrame(()=>{ captureFlash.classList.remove('flash'); });

  renderer.domElement.toBlob(async (blob)=>{
    if(!blob) return;
    const stamp = new Date().toISOString().replace(/[:.]/g,'-');
    const filename = `matrix-city-pov-${stamp}.png`;
    let done = false, label = 'SAVED';

    // best path on iPhone/iPad — hands the image to the native share sheet,
    // which has a direct "Save Image" (to Photos) option. Anchor-tag
    // downloads are unreliable in iOS Safari, so this is tried first there.
    if(navigator.canShare && navigator.share){
      try{
        const file = new File([blob], filename, { type:'image/png' });
        if(navigator.canShare({ files:[file] })){
          await navigator.share({ files:[file], title:'Matrix City — POV' });
          done = true; label = 'SHARED';
        }
      } catch(err){ /* cancelled or unsupported mid-call — fall through */ }
    }

    if(!done){
      const url = URL.createObjectURL(blob);
      const isiOS = /iP(hone|ad|od)/.test(navigator.userAgent);
      if(isiOS){
        // Safari ignores the download attribute for most sources — opening
        // the image directly lets the user long-press → Save to Photos
        window.open(url, '_blank');
      } else {
        const link = document.createElement('a');
        link.href = url; link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
      }
      setTimeout(()=> URL.revokeObjectURL(url), 30000);
    }

    captureToast.textContent = label;
    captureToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> captureToast.classList.remove('show'), 1400);
  }, 'image/png');
}
screenshotBtn.addEventListener('click', takeScreenshot);

container.addEventListener('wheel', e=>{

  if(povActive){

    povCamera.fov = Math.min(85, Math.max(35, povCamera.fov + e.deltaY*0.02));
    povCamera.updateProjectionMatrix();
    return;
  }
  camZoomTarget = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, camZoomTarget - e.deltaY*0.0016));
}, { passive:false });

function clampRig(){
  rig.position.x = Math.max(-CITY_HALF, Math.min(CITY_HALF, rig.position.x));
  rig.position.z = Math.max(-CITY_HALF, Math.min(CITY_HALF, rig.position.z));
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const CENTER_NDC = new THREE.Vector2(0,0); // reused for POV crosshair raycasts

function toNDC(x,y){
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((x-rect.left)/rect.width)*2 - 1;
  ndc.y = -(((y-rect.top)/rect.height)*2 - 1);
  return ndc;
}

let hovered = null;
function handleHover(e){
  raycaster.setFromCamera(toNDC(e.clientX,e.clientY), camera);
  const hits = raycaster.intersectObjects(placeholderMeshes);
  if(hits.length){
    if(hovered !== hits[0].object){ hovered = hits[0].object; }
    container.classList.add('hoverable');
  } else {
    hovered = null;
    container.classList.remove('hoverable');
  }
}

function handleTap(x,y){
  raycaster.setFromCamera(toNDC(x,y), camera);
  const hits = raycaster.intersectObjects(placeholderMeshes);
  if(hits.length){
    openPanel(hits[0].object.userData.district, x, y);
  }
}

// POV taps always aim from the screen centre (the crosshair) rather than
// the tap point, since a short tap is how you "select" while look-dragging
function handleTapPov(){
  raycaster.setFromCamera(CENTER_NDC, povCamera);
  const hits = raycaster.intersectObjects(placeholderMeshes);
  if(hits.length){
    openPanel(hits[0].object.userData.district, window.innerWidth/2, window.innerHeight/2);
  }
}

const joystickEl = document.getElementById('joystick');
const joystickThumb = document.getElementById('joystickThumb');
let joystickActive = false, joystickPointerId = null, joystickX = 0, joystickY = 0;
const JOY_RADIUS = 40;

function joystickSet(clientX, clientY){
  const rect = joystickEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = clientX - cx, dy = clientY - cy;
  const dist = Math.hypot(dx, dy);
  if(dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
  joystickThumb.style.transform = `translate(${dx-22}px, ${dy-22}px)`;
  joystickX = dx / JOY_RADIUS; // -1..1 strafe
  joystickY = dy / JOY_RADIUS; // -1..1 forward(-)/back(+)
}
function joystickReset(){
  joystickActive = false; joystickPointerId = null; joystickX = 0; joystickY = 0;
  joystickThumb.style.transform = 'translate(-50%,-50%)';
}
joystickEl.addEventListener('pointerdown', e=>{
  e.stopPropagation();
  joystickEl.setPointerCapture(e.pointerId);
  joystickActive = true; joystickPointerId = e.pointerId;
  joystickSet(e.clientX, e.clientY);
});
joystickEl.addEventListener('pointermove', e=>{
  if(!joystickActive || e.pointerId !== joystickPointerId) return;
  e.stopPropagation();
  joystickSet(e.clientX, e.clientY);
});
function joystickEnd(e){
  if(e.pointerId !== joystickPointerId) return;
  e.stopPropagation();
  joystickReset();
}

function scrambleInto(el, text, duration=650){
  const chars = '!<>-_\\/[]{}=+*^?#01';
  const len = text.length;
  let start = null;
  el.textContent = '';
  function frame(ts){
    if(start===null) start = ts;
    const p = Math.min((ts-start)/duration, 1);
    const reveal = Math.floor(p*len);
    let out = '';
    for(let i=0;i<len;i++){
      if(i < reveal || text[i] === ' ') out += text[i];
      else out += chars[(Math.random()*chars.length)|0];
    }
    el.textContent = out;
    if(p < 1) requestAnimationFrame(frame);
    else el.textContent = text;
  }
  requestAnimationFrame(frame);
}

/* ---------- flip-through gallery controller ---------- */
let galleryImages = [];
let galleryIndex = 0;
let galleryFlipToken = 0; // invalidates any in-flight flip when a newer one starts

// keep loaded images warm so flipping to them is instant and doesn't
// pop/flash while the browser fetches+decodes the file mid-animation
const imageCache = new Map();
function preloadImage(url){
  if(!url || imageCache.has(url)) return Promise.resolve();
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=> resolve();
    img.onerror = ()=> resolve();
    img.src = url;
    imageCache.set(url, img);
  });
}
function preloadNeighbors(i){
  if(!galleryImages.length) return;
  const n = galleryImages.length;
  preloadImage(galleryImages[i]);
  preloadImage(galleryImages[(i+1)%n]);
  preloadImage(galleryImages[(i-1+n)%n]);
}
// warm the rest of the set quietly in the background, a couple frames apart
function preloadRestLazily(){
  const list = galleryImages.slice();
  let k = 0;
  function step(){
    if(k >= list.length) return;
    preloadImage(list[k]);
    k++;
    setTimeout(step, 60);
  }
  step();
}

function renderGalleryDots(){
  galleryDots.innerHTML = '';
  galleryImages.forEach((_, i)=>{
    const dot = document.createElement('span');
    if(i === galleryIndex) dot.classList.add('active');
    dot.addEventListener('click', ()=> goToSlide(i));
    galleryDots.appendChild(dot);
  });
}

const GALLERY_EASE = 'cubic-bezier(.22,1,.36,1)'; // modern "ease-out-expo"-ish curve
const GALLERY_SLIDE_PX = 14; // subtle, not a big swipe-across-the-screen slide

function goToSlide(i, instant=false){
  const dir = ((i - galleryIndex + galleryImages.length*3) % galleryImages.length) <= galleryImages.length/2 ? 1 : -1;
  galleryIndex = (i + galleryImages.length) % galleryImages.length;
  const targetSrc = galleryImages[galleryIndex];
  const token = ++galleryFlipToken;

  [...galleryDots.children].forEach((dot,i2)=> dot.classList.toggle('active', i2===galleryIndex));
  updateLightboxIfOpen();
  preloadNeighbors(galleryIndex);

  if(instant){
    galleryImg.style.transition = 'none';
    galleryImg.style.transform = 'none';
    galleryImg.style.opacity = '1';
    galleryImg.src = targetSrc;
    return;
  }

  // wait for the incoming frame to actually be decoded before swapping to
  // it, so the crossfade never lands on a blank/half-loaded image
  preloadImage(targetSrc).then(()=>{
    if(token !== galleryFlipToken) return; // a newer transition took over

    // current image gently fades out and drifts out in the travel direction
    galleryImg.style.transition = `opacity .22s ease, transform .22s ${GALLERY_EASE}`;
    galleryImg.style.opacity = '0';
    galleryImg.style.transform = `translateX(${dir*-GALLERY_SLIDE_PX}px)`;

    setTimeout(()=>{
      if(token !== galleryFlipToken) return;
      // swap the frame while it's invisible, positioned on the entry side...
      galleryImg.src = targetSrc;
      galleryImg.style.transition = 'none';
      galleryImg.style.transform = `translateX(${dir*GALLERY_SLIDE_PX}px)`;
      // ...then let it settle into place with a fade + slide in
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          if(token !== galleryFlipToken) return;
          galleryImg.style.transition = `opacity .28s ease, transform .28s ${GALLERY_EASE}`;
          galleryImg.style.opacity = '1';
          galleryImg.style.transform = 'translateX(0)';
        });
      });
    }, 220);
  });
}

galleryPrev.addEventListener('click', ()=> goToSlide(galleryIndex-1));
galleryNext.addEventListener('click', ()=> goToSlide(galleryIndex+1));
